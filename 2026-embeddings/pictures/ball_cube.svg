      transform="rotate(-90 18 205)">share of the cube’s volume</text>
<text x="76" y="420" fill="#898781" font-size="12">V_ball / V_cube = π^(d/2) / (Γ(d/2+1) · 2^d). All the volume of a high-dimensional cube sits in its corners — and</text><text x="76" y="436" fill="#898781" font-size="12">the corners are far away.</text>
